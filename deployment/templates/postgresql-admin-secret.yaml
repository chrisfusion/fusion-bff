{{- if and .Values.postgresql.createDatabaseJob.enabled (not .Values.postgresql.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fusion-bff.pgAdminSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-bff.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "postgresql.external.password (or postgresql.external.existingSecret) is required when postgresql.createDatabaseJob.enabled is true" .Values.postgresql.external.password | quote }}
{{- end }}
