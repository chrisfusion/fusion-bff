      parameters:
      - name: fieldSelector
        in: query
        schema:
          type: string
          pattern: ^[a-zA-Z0-9./=!,_()\- ]{0,512}$
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/K8sEvent'
        '400':
          description: fieldSelector fails validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveError'
  /api/content/api/v1/changelog:
    get:
      tags:
      - content
      summary: List merged changelog entries across projects
      x-required-permission: content:changelog:read
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: project
        in: query
        schema:
          type: string
        description: Exact-match project name filter
      - name: date
        in: query
        schema:
          type: string
        description: ISO YYYY-MM-DD, or the literal "unreleased"
      responses:
        '200':
          description: |
            Paginated changelog date-groups. Invalid page/pageSize silently fall back to defaults; an unmatched project/date filter yields an empty data array (not an error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangelogResponse'
  /api/content/api/v1/help:
    get:
      tags:
      - content
      summary: List/search help article summaries
      x-required-permission: content:help:read
      parameters:
      - name: service
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
          enum:
          - tutorial
          - how-to
          - reference
          - explanation
      - name: tag
        in: query
        schema:
          type: string
      - name: route
        in: query
        schema:
          type: string
        description: Frontend route path filter
      - name: q
        in: query
        schema:
          type: string
        description: Full-text search (AND over tokenized title+summary+body+tags)
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: Paginated help article summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpListResponse'
  /api/content/api/v1/help/{service}/{type}/{slug}:
    parameters:
    - name: service
      in: path
      required: true
      schema:
        type: string
    - name: type
      in: path
      required: true
      schema:
        type: string
        enum:
        - tutorial
        - how-to
        - reference
        - explanation
    - name: slug
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - content
      summary: Get a single help article, including full body
      x-required-permission: content:help:read
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentError'
  /api/content/api/v1/videos:
    get:
      tags:
      - content
      summary: List video metadata
      x-required-permission: content:videos:read
      parameters:
      - name: service
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: Paginated video list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
  /api/content/api/v1/videos/{service}/{slug}:
    parameters:
    - name: service
      in: path
      required: true
      schema:
        type: string
    - name: slug
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - content
      summary: Get a single video's metadata
      x-required-permission: content:videos:read
      responses:
        '200':
          description: Video found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '404':
          description: Video not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentError'
  /api/forge/{path}:
    $ref: '#/components/pathItems/proxy'
  /api/index/{path}:
    $ref: '#/components/pathItems/proxy'
  /api/weave/{path}:
    $ref: '#/components/pathItems/proxy'
  /api/content/{path}:
    $ref: '#/components/pathItems/proxy'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: HttpOnly session cookie set by /bff/callback
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token, accepted as a fallback when no session cookie is present
  schemas:
    GroupRoleRow:
      type: object
      properties:
        id:
          type: integer
        group:
          type: string
        role:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    ResourcePermRow:
      type: object
      properties:
        id:
          type: integer
        subject_type:
          type: string
          enum:
          - user
          - group
          - role
        subject:
          type: string
        permission:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    ServiceStatusRow:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
          enum:
          - Healthy
          - Unhealthy
          - Offline
          - Maintenance
        description:
          type: string
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time
    ForgeError:
      type: object
      properties:
        error:
          type: string
    ForgeBuildResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        version:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          example: SUCCESS
          description: PENDING | BUILDING | SUCCESS | FAILED
        buildType:
          type: string
          description: requirements | git | app
        creatorId:
          type: string
          nullable: true
        creatorEmail:
          type: string
          nullable: true
        indexArtifactId:
          type: integer
          format: int64
          nullable: true
        indexArtifactVersion:
          type: string
          nullable: true
        ciBuildName:
          type: string
          nullable: true
        repoUrl:
          type: string
          nullable: true
        repoRef:
          type: string
          nullable: true
        entrypointFile:
          type: string
          nullable: true
        metadataSource:
          type: string
        projectDir:
          type: string
          nullable: true
        pythonVersion:
          type: string
          example: '3.12'
        runner:
          type: string
          nullable: true
        baseDependenciesUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ForgePageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ForgeBuildResponse'
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
    ForgeViolation:
      type: object
      properties:
        line:
          type: integer
        content:
          type: string
        message:
          type: string
    ForgeValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/ForgeViolation'
    ForgeBulkDeleteResponse:
      type: object
      properties:
        deleted:
          type: array
          items:
            type: integer
            format: int64
        failed:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              error:
                type: string
    BulkDeleteBuildsRequest:
      type: object
      required:
      - statuses
      properties:
        statuses:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - FAILED
            - SUCCESS
        older_than:
          type: string
          format: date-time
        build_type:
          type: string
          description: requirements | git | app
    ZombieCleanupRequest:
      type: object
      properties:
        older_than:
          type: string
          format: date-time
        build_type:
          type: string
          description: requirements | git | app
    CreateVenvRequest:
      type: object
      required:
      - name
      - version
      - requirements
      properties:
        name:
          type: string
          maxLength: 255
        version:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 2000
        requirements:
          type: string
          format: binary
          description: requirements.txt, 1 byte - 100KB
        python_version:
          type: string
          maxLength: 10
          enum:
          - '3.10'
          - '3.12'
          default: '3.12'
    CreateGitBuildRequest:
      type: object
      required:
      - repo_url
      description: |
        name/version become required depending on metadata_source: "manual" (default) requires both; "version" requires only name (version resolved from pyproject.toml); "full" resolves both from pyproject.toml.
      properties:
        name:
          type: string
          maxLength: 255
        version:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 2000
        repo_url:
          type: string
          format: uri
          maxLength: 2048
        repo_ref:
          type: string
          maxLength: 255
          default: main
        entrypoint_file:
          type: string
          maxLength: 500
        metadata_source:
          type: string
          maxLength: 32
          enum:
          - manual
          - version
          - full
          default: manual
        project_dir:
          type: string
          maxLength: 500
          description: relative path, no .. escape
        python_version:
          type: string
          maxLength: 10
          enum:
          - '3.10'
          - '3.12'
          default: '3.12'
    CreateAppBuildRequest:
      type: object
      required:
      - repo_url
      description: name/version/builderImage/runner are resolved server-side from metadata.yaml.
      properties:
        repo_url:
          type: string
          format: uri
          maxLength: 2048
        repo_ref:
          type: string
          maxLength: 255
          default: main
        project_dir:
          type: string
          maxLength: 500
          description: relative path, no .. escape
    SecretKeyRefRequest:
      type: object
      required:
      - name
      - key
      properties:
        name:
          type: string
        key:
          type: string
    CreateGitWatcherRequest:
      type: object
      required:
      - name
      - repo_url
      - build_type
      properties:
        name:
          type: string
          maxLength: 253
        repo_url:
          type: string
          format: uri
          maxLength: 2048
        repo_ref:
          type: string
          maxLength: 255
          default: main
        build_type:
          type: string
          maxLength: 32
          enum:
          - git
          - app
        enabled:
          type: boolean
          nullable: true
          default: true
        token_secret_ref:
          $ref: '#/components/schemas/SecretKeyRefRequest'
        artifact_name:
          type: string
          maxLength: 255
        metadata_source:
          type: string
          maxLength: 32
          enum:
          - manual
          - version
          - full
          default: manual
          description: only meaningful when build_type=git
        version:
          type: string
          maxLength: 50
        python_version:
          type: string
          maxLength: 10
          enum:
          - '3.10'
          - '3.12'
        entrypoint_file:
          type: string
          maxLength: 500
        project_dir:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
    UpdateGitWatcherRequest:
      type: object
      required:
      - repo_url
      - build_type
      description: Same fields as CreateGitWatcherRequest, minus name (taken from the URL path).
      properties:
        repo_url:
          type: string
          format: uri
          maxLength: 2048
        repo_ref:
          type: string
          maxLength: 255
          default: main
        build_type:
          type: string
          maxLength: 32
          enum:
          - git
          - app
        enabled:
          type: boolean
          nullable: true
        token_secret_ref:
          $ref: '#/components/schemas/SecretKeyRefRequest'
        artifact_name:
          type: string
          maxLength: 255
        metadata_source:
          type: string
          maxLength: 32
          enum:
          - manual
          - version
          - full
        version:
          type: string
          maxLength: 50
        python_version:
          type: string
          maxLength: 10
          enum:
          - '3.10'
          - '3.12'
        entrypoint_file:
          type: string
          maxLength: 500
        project_dir:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
    SecretKeyRefResponse:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
    GitWatcherSpecResponse:
      type: object
      properties:
        repoURL:
          type: string
        repoRef:
          type: string
        buildType:
          type: string
        enabled:
          type: boolean
          nullable: true
        tokenSecretRef:
          $ref: '#/components/schemas/SecretKeyRefResponse'
        name:
          type: string
          description: artifact_name from the create/update request
        metadataSource:
          type: string
        version:
          type: string
        pythonVersion:
          type: string
        entrypointFile:
          type: string
        projectDir:
          type: string
        description:
          type: string
    GitWatcherStatusResponse:
      type: object
      properties:
        phase:
          type: string
        lastSeenCommit:
          type: string
        lastBuiltVersion:
          type: string
        lastBuildName:
          type: string
        lastBuildVersion:
          type: string
        consecutiveFailures:
          type: integer
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
        message:
          type: string
    GitWatcherResponse:
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        createdAt:
          type: string
          format: date-time
        spec:
          $ref: '#/components/schemas/GitWatcherSpecResponse'
        status:
          $ref: '#/components/schemas/GitWatcherStatusResponse'
    GitWatcherPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GitWatcherResponse'
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
    IndexError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: artifact not found
    IndexTypeResponse:
      type: object
      required:
      - id
      - name
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 255
          example: ml-model
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IndexCreateTypeRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
          nullable: true
    IndexUpdateTypeRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
          nullable: true
    IndexArtifactResponse:
      type: object
      required:
      - id
      - fullName
      - types
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
          maxLength: 500
          example: org.platform.data.pipeline
        description:
          type: string
          nullable: true
        types:
          type: array
          items:
            $ref: '#/components/schemas/IndexTypeResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IndexArtifactPage:
      type: object
      required:
      - items
      - total
      - page
      - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IndexArtifactResponse'
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
    IndexCreateArtifactRequest:
      type: object
      required:
      - fullName
      properties:
        fullName:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
          nullable: true
    IndexUpdateArtifactRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 2000
          nullable: true
    IndexTagResponse:
      type: object
      required:
      - id
      - artifactId
      - tag
      - versionId
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
          format: int64
        artifactId:
          type: integer
          format: int64
        tag:
          type: string
        versionId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IndexVersionResponse:
      type: object
      required:
      - id
      - artifactId
      - version
      - major
      - minor
      - patch
      - tags
      - createdAt
      properties:
        id:
          type: integer
          format: int64
        artifactId:
          type: integer
          format: int64
        version:
          type: string
          example: 1.2.3
        major:
          type: integer
        minor:
          type: integer
        patch:
          type: integer
        config:
          type: string
          nullable: true
          description: Raw configuration string (JSON or YAML)
        tags:
          type: array
          items:
            $ref: '#/components/schemas/IndexTagResponse'
        createdAt:
          type: string
          format: date-time
    IndexCreateVersionRequest:
      type: object
      required:
      - version
      properties:
        version:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        config:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          description: Tag names to assign on creation
    IndexAssignTagRequest:
      type: object
      required:
      - version
      properties:
        version:
          type: string
          pattern: ^\d+\.\d+\.\d+$
    IndexFileResponse:
      type: object
      required:
      - id
      - versionId
      - name
      - storageBackend
      - status
      - downloadUrl
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
          format: int64
        versionId:
          type: integer
          format: int64
        name:
          type: string
          example: model.onnx
        contentType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          format: int64
          nullable: true
        storageBackend:
          type: string
          enum:
          - FILESYSTEM
          - S3
        status:
          type: string
          enum:
          - PENDING
          - AVAILABLE
          - ERROR
        downloadUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WeaveError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    K8sObjectMeta:
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        uid:
          type: string
        resourceVersion:
          type: string
        generation:
          type: integer
        creationTimestamp:
          type: string
          format: date-time
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    K8sEnvVar:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        valueFrom:
          type: object
          additionalProperties: true
    K8sResourceRequirements:
      type: object
      properties:
        limits:
          type: object
          additionalProperties:
            type: string
        requests:
          type: object
          additionalProperties:
            type: string
    K8sLocalObjectReference:
      type: object
      properties:
        name:
          type: string
    K8sJob:
      type: object
      description: Standard Kubernetes batch/v1 Job — modeled as an opaque object.
      additionalProperties: true
    K8sDeployment:
      type: object
      description: Standard Kubernetes apps/v1 Deployment — modeled as an opaque object.
      additionalProperties: true
    K8sEvent:
      type: object
      description: Standard Kubernetes core/v1 Event — modeled as an opaque object.
      additionalProperties: true
    WeaveVolumeMount:
      type: object
      required:
      - name
      - mountPath
      properties:
        name:
          type: string
        mountPath:
          type: string
        secretName:
          type: string
        configMapName:
          type: string
    WeaveRetryPolicy:
      type: object
      properties:
        maxRetries:
          type: integer
          minimum: 0
          default: 0
        backoffSeconds:
          type: integer
          minimum: 1
          default: 10
    WeaveJobTemplateSpec:
      type: object
      required:
      - image
      properties:
        image:
          type: string
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
        resources:
          $ref: '#/components/schemas/K8sResourceRequirements'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/WeaveVolumeMount'
        retryPolicy:
          $ref: '#/components/schemas/WeaveRetryPolicy'
        parallelism:
          type: integer
          minimum: 1
          default: 1
        completions:
          type: integer
          minimum: 1
          default: 1
        activeDeadlineSeconds:
          type: integer
          format: int64
          nullable: true
        serviceAccountName:
          type: string
        podSecurityContext:
          type: object
          additionalProperties: true
        containerSecurityContext:
          type: object
          additionalProperties: true
        codeSource:
          $ref: '#/components/schemas/WeaveCodeSourceSpec'
    WeaveJobTemplateStatus:
      type: object
      properties:
        observedGeneration:
          type: integer
          format: int64
        valid:
          type: boolean
        validationMessage:
          type: string
    WeaveJobTemplate:
      type: object
      properties:
        kind:
          type: string
          example: WeaveJobTemplate
        apiVersion:
          type: string
          example: weave.fusion-platform.io/v1alpha1
        metadata:
          $ref: '#/components/schemas/K8sObjectMeta'
        spec:
          $ref: '#/components/schemas/WeaveJobTemplateSpec'
        status:
          $ref: '#/components/schemas/WeaveJobTemplateStatus'
    WeaveJobTemplateList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeaveJobTemplate'
    WeaveServicePort:
      type: object
      required:
      - name
      - port
      properties:
        name:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        targetPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: Defaults to port
        protocol:
          type: string
          enum:
          - TCP
          - UDP
          - SCTP
          default: TCP
    WeaveIngressRule:
      type: object
      required:
      - host
      - servicePort
      properties:
        host:
          type: string
        path:
          type: string
          default: /
        pathType:
          type: string
          enum:
          - Exact
          - Prefix
          - ImplementationSpecific
          default: Prefix
        servicePort:
          type: string
    WeaveIngressSpec:
      type: object
      required:
      - rules
      properties:
        ingressClassName:
          type: string
          nullable: true
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WeaveIngressRule'
        tlsSecretName:
          type: string
    WeaveCodeSourceSpec:
      type: object
      required:
      - artifactName
      - tag
      properties:
        indexURL:
          type: string
        artifactName:
          type: string
        tag:
          type: string
        mountPath:
          type: string
          default: /weave-code
        loaderImage:
          type: string
        loaderImagePullPolicy:
          type: string
          enum:
          - Always
          - Never
          - IfNotPresent
    WeaveServiceTemplateSpec:
      type: object
      required:
      - image
      - ports
      properties:
        image:
          type: string
          minLength: 1
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
        resources:
          $ref: '#/components/schemas/K8sResourceRequirements'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/WeaveVolumeMount'
        serviceAccountName:
          type: string
        podSecurityContext:
          type: object
          additionalProperties: true
        containerSecurityContext:
          type: object
          additionalProperties: true
        replicas:
          type: integer
          minimum: 1
          default: 1
        ports:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WeaveServicePort'
        livenessProbe:
          type: object
          additionalProperties: true
        readinessProbe:
          type: object
          additionalProperties: true
        startupProbe:
          type: object
          additionalProperties: true
        serviceType:
          type: string
          enum:
          - ClusterIP
          - NodePort
          - LoadBalancer
          default: ClusterIP
        ingress:
          $ref: '#/components/schemas/WeaveIngressSpec'
        unhealthyDuration:
          type: string
          default: 5m
        revisionHistoryLimit:
          type: integer
          default: 5
          minimum: 1
        codeSource:
          $ref: '#/components/schemas/WeaveCodeSourceSpec'
    WeaveServiceTemplateStatus:
      type: object
      properties:
        observedGeneration:
          type: integer
          format: int64
        valid:
          type: boolean
        validationMessage:
          type: string
    WeaveServiceTemplate:
      type: object
      properties:
        kind:
          type: string
          example: WeaveServiceTemplate
        apiVersion:
          type: string
          example: weave.fusion-platform.io/v1alpha1
        metadata:
          $ref: '#/components/schemas/K8sObjectMeta'
        spec:
          $ref: '#/components/schemas/WeaveServiceTemplateSpec'
        status:
          $ref: '#/components/schemas/WeaveServiceTemplateStatus'
    WeaveServiceTemplateList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeaveServiceTemplate'
    WeaveChainStep:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        stepKind:
          type: string
          enum:
          - Job
          - Deploy
          default: Job
        jobTemplateRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        serviceTemplateRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        dependsOn:
          type: array
          items:
            type: string
        runOnSuccess:
          type: boolean
          default: true
        runOnFailure:
          type: boolean
          default: false
        envOverrides:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
        producesOutput:
          type: boolean
        consumesOutputFrom:
          type: array
          items:
            type: string
    WeaveSharedStorageSpec:
      type: object
      required:
      - size
      properties:
        size:
          type: string
          example: 500Mi
        storageClassName:
          type: string
          nullable: true
    WeaveChainSpec:
      type: object
      required:
      - steps
      properties:
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WeaveChainStep'
        failurePolicy:
          type: string
          enum:
          - StopAll
          - ContinueOthers
          - RetryFailed
          default: StopAll
        concurrencyPolicy:
          type: string
          enum:
          - Wait
          - Forbid
          default: Wait
        sharedStorage:
          $ref: '#/components/schemas/WeaveSharedStorageSpec'
        authSecretRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
          description: >-
            Optionally names a Secret injected via envFrom into every step pod
            of this chain (Job and Deploy kind alike). Its keys become
            environment variables that runner-side helper libraries (e.g. the
            fusion-runner Python KeycloakAuth helper) use to obtain access
            tokens. Overridable per-trigger (authSecretRefOverride) or
            per-run (authSecretRefOverride); precedence is run > trigger > chain.
    WeaveActiveDeploymentStatus:
      type: object
      properties:
        deploymentName:
          type: string
        stepName:
          type: string
        health:
          type: string
          enum:
          - Healthy
          - Unhealthy
          - RollingBack
          - RolledBack
          - Unknown
        currentRevision:
          type: string
        lastRollbackRevision:
          type: string
        unhealthySince:
          type: string
          format: date-time
          nullable: true
        lastRollbackTime:
          type: string
          format: date-time
          nullable: true
        unhealthyDurationSeconds:
          type: integer
          format: int64
        message:
          type: string
        codeSourceArtifact:
          type: string
        codeSourceTag:
          type: string
        codeSourceIndexURL:
          type: string
        codeSourceDeployedVersion:
          type: string
    WeaveChainStatus:
      type: object
      properties:
        observedGeneration:
          type: integer
          format: int64
        valid:
          type: boolean
        validationMessage:
          type: string
        activeDeployments:
          type: object
          description: keyed by "<chainName>-<stepName>"
          additionalProperties:
            $ref: '#/components/schemas/WeaveActiveDeploymentStatus'
    WeaveChain:
      type: object
      properties:
        kind:
          type: string
          example: WeaveChain
        apiVersion:
          type: string
          example: weave.fusion-platform.io/v1alpha1
        metadata:
          $ref: '#/components/schemas/K8sObjectMeta'
        spec:
          $ref: '#/components/schemas/WeaveChainSpec'
        status:
          $ref: '#/components/schemas/WeaveChainStatus'
    WeaveChainList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeaveChain'
    WeaveWebhookConfig:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          minLength: 2
          pattern: ^/.*
        secretRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
    WeaveBatchCronConfig:
      type: object
      required:
      - jobsConfigMapRef
      properties:
        jobsConfigMapRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
    WeaveKafkaConfig:
      type: object
      required:
      - brokers
      - topic
      - consumerGroup
      properties:
        brokers:
          type: array
          items:
            type: string
        topic:
          type: string
        consumerGroup:
          type: string
        secretRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        eventFilter:
          type: array
          items:
            type: string
            enum:
            - put
            - delete
            - get
        bucketFilter:
          type: array
          items:
            type: string
        maxConcurrentRuns:
          type: integer
          description: 0 = unlimited
    WeaveTriggerSpec:
      type: object
      required:
      - chainRef
      - type
      properties:
        chainRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        type:
          type: string
          enum:
          - OnDemand
          - Cron
          - Webhook
          - BatchCron
          - Kafka
        schedule:
          type: string
          description: Cron expression; only for type=Cron
        webhook:
          $ref: '#/components/schemas/WeaveWebhookConfig'
        batchCron:
          $ref: '#/components/schemas/WeaveBatchCronConfig'
        kafka:
          $ref: '#/components/schemas/WeaveKafkaConfig'
        paused:
          type: boolean
        authSecretRefOverride:
          $ref: '#/components/schemas/K8sLocalObjectReference'
          description: >-
            Overrides WeaveChainSpec.authSecretRef for every run created by
            this trigger. Takes precedence over the chain default; yields to
            WeaveRunSpec.authSecretRefOverride on the resulting run.
        parameterOverrides:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
    WeaveTriggerStatus:
      type: object
      properties:
        active:
          type: boolean
        lastScheduleTime:
          type: string
          format: date-time
          nullable: true
        lastRunName:
          type: string
        webhookURL:
          type: string
        pendingRuns:
          type: array
          items:
            type: string
        batchJobCount:
          type: integer
          description: BatchCron only
        batchJobErrors:
          type: integer
          description: BatchCron only
    WeaveTrigger:
      type: object
      properties:
        kind:
          type: string
          example: WeaveTrigger
        apiVersion:
          type: string
          example: weave.fusion-platform.io/v1alpha1
        metadata:
          $ref: '#/components/schemas/K8sObjectMeta'
        spec:
          $ref: '#/components/schemas/WeaveTriggerSpec'
        status:
          $ref: '#/components/schemas/WeaveTriggerStatus'
    WeaveTriggerList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeaveTrigger'
    WeaveBatchTriggerRequest:
      type: object
      required:
      - name
      - chainRef
      - jobs
      properties:
        name:
          type: string
        chainRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        jobs:
          type: string
          description: Raw jobs YAML
          parsed via trigger.ParseBatchJobs: null
    WeaveBatchValidationError:
      type: object
      properties:
        line:
          type: integer
        message:
          type: string
    WeaveBatchValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/WeaveBatchValidationError'
    WeaveKafkaTriggerRequest:
      type: object
      required:
      - name
      - chainRef
      - kafka
      properties:
        name:
          type: string
          description: Required on create only
        chainRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        kafka:
          $ref: '#/components/schemas/WeaveKafkaConfig'
    WeaveRunStepOverride:
      type: object
      required:
      - stepName
      - artifactName
      - tag
      properties:
        stepName:
          type: string
        artifactName:
          type: string
        tag:
          type: string
        ingressHost:
          type: string
        indexURL:
          type: string
    WeaveRunSpec:
      type: object
      required:
      - chainRef
      properties:
        chainRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        triggerRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        parameterOverrides:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
        stepOverrides:
          type: array
          items:
            $ref: '#/components/schemas/WeaveRunStepOverride'
        authSecretRefOverride:
          $ref: '#/components/schemas/K8sLocalObjectReference'
          description: >-
            Overrides WeaveChainSpec.authSecretRef (and any
            WeaveTriggerSpec.authSecretRefOverride) for this run only.
            Injected via envFrom into every step pod of this run.
    WeaveRunStepStatus:
      type: object
      properties:
        name:
          type: string
        phase:
          type: string
          enum:
          - Pending
          - Running
          - Succeeded
          - Failed
          - Skipped
          - Retrying
          - Deployed
        jobRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        retryCount:
          type: integer
        nextRetryAfter:
          type: string
          format: date-time
          nullable: true
        startTime:
          type: string
          format: date-time
          nullable: true
        completionTime:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
        outputCaptured:
          type: boolean
        deploymentRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
    WeaveRunStatus:
      type: object
      properties:
        phase:
          type: string
          enum:
          - Pending
          - Running
          - Succeeded
          - Failed
          - Stopped
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WeaveRunStepStatus'
        startTime:
          type: string
          format: date-time
          nullable: true
        completionTime:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
        sharedPVCName:
          type: string
        activeDeployments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WeaveActiveDeploymentStatus'
    WeaveRun:
      type: object
      properties:
        kind:
          type: string
          example: WeaveRun
        apiVersion:
          type: string
          example: weave.fusion-platform.io/v1alpha1
        metadata:
          $ref: '#/components/schemas/K8sObjectMeta'
        spec:
          $ref: '#/components/schemas/WeaveRunSpec'
        status:
          $ref: '#/components/schemas/WeaveRunStatus'
    WeaveRunList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeaveRun'
    WeaveMonitorRunSummary:
      type: object
      properties:
        name:
          type: string
        chain:
          type: string
        phase:
          type: string
          enum:
          - Pending
          - Running
          - Succeeded
          - Failed
          - Stopped
        startTime:
          type: string
          format: date-time
          nullable: true
        completionTime:
          type: string
          format: date-time
          nullable: true
        stepCount:
          type: integer
        failedSteps:
          type: integer
        message:
          type: string
    WeaveMonitorRunDetail:
      type: object
      properties:
        run:
          $ref: '#/components/schemas/WeaveRun'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/K8sJob'
        events:
          type: array
          items:
            $ref: '#/components/schemas/K8sEvent'
    WeaveMonitorLogResponse:
      type: object
      properties:
        runName:
          type: string
        stepName:
          type: string
        podName:
          type: string
        lines:
          type: array
          items:
            type: string
    WeaveMonitorRunStats:
      type: object
      properties:
        window:
          type: string
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        running:
          type: integer
        pending:
          type: integer
        stopped:
          type: integer
        successRate:
          type: number
          format: double
        avgDurationMs:
          type: integer
          format: int64
        minDurationMs:
          type: integer
          format: int64
        maxDurationMs:
          type: integer
          format: int64
    ContentError:
      type: object
      properties:
        error:
          type: string
    ContentPagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ChangelogChanges:
      type: object
      properties:
        added:
          type: array
          items:
            type: string
        changed:
          type: array
          items:
            type: string
        fixed:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string
    ChangelogProjectEntry:
      type: object
      properties:
        project:
          type: string
        version:
          type: string
        changes:
          $ref: '#/components/schemas/ChangelogChanges'
    ChangelogDateGroup:
      type: object
      properties:
        date:
          type: string
          description: ISO YYYY-MM-DD, or "unreleased"
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ChangelogProjectEntry'
    ChangelogResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChangelogDateGroup'
        pagination:
          $ref: '#/components/schemas/ContentPagination'
    HelpArticleSummary:
      type: object
      properties:
        service:
          type: string
        type:
          type: string
          enum:
          - tutorial
          - how-to
          - reference
          - explanation
        slug:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        routes:
          type: array
          items:
            type: string
          description: Frontend paths for context-sensitive help
        summary:
          type: string
    HelpListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HelpArticleSummary'
        pagination:
          $ref: '#/components/schemas/ContentPagination'
    ArticleResponse:
      allOf:
      - $ref: '#/components/schemas/HelpArticleSummary'
      - type: object
        properties:
          body:
            type: string
            description: Full markdown body
    VideoResponse:
      type: object
      properties:
        service:
          type: string
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        thumbnailUrl:
          type: string
        videoUrl:
          type: string
        tags:
          type: array
          items:
            type: string
    VideoListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VideoResponse'
        pagination:
          $ref: '#/components/schemas/ContentPagination'
  pathItems:
    proxy:
      parameters:
      - in: path
        name: path
        required: true
        schema:
          type: string
        description: Upstream path, forwarded verbatim after stripping the /api/<service> prefix
      get:
        tags:
        - proxy
        summary: Proxy passthrough (any HTTP method)
        security:
        - sessionCookie: []
        - bearerAuth: []
        responses:
          '200':
            description: Upstream response
            forwarded verbatim: null
          '401':
            description: No valid session or bearer token
          '403':
            description: Missing required RBAC permission for this route
      post:
        tags:
        - proxy
        summary: Proxy passthrough (any HTTP method)
        security:
        - sessionCookie: []
        - bearerAuth: []
        responses:
          '200':
            description: Upstream response
            forwarded verbatim: null
          '401':
            description: No valid session or bearer token
          '403':
            description: Missing required RBAC permission for this route
      put:
        tags:
        - proxy
        summary: Proxy passthrough (any HTTP method)
        security:
        - sessionCookie: []
        - bearerAuth: []
        responses:
          '200':
            description: Upstream response
            forwarded verbatim: null
          '401':
            description: No valid session or bearer token
          '403':
            description: Missing required RBAC permission for this route
      patch:
        tags:
        - proxy
        summary: Proxy passthrough (any HTTP method)
        security:
        - sessionCookie: []
        - bearerAuth: []
        responses:
          '200':
            description: Upstream response
            forwarded verbatim: null
          '401':
            description: No valid session or bearer token
          '403':
            description: Missing required RBAC permission for this route
      delete:
        tags:
        - proxy
        summary: Proxy passthrough (any HTTP method)
        security:
        - sessionCookie: []
        - bearerAuth: []
        responses:
          '200':
            description: Upstream response
            forwarded verbatim: null
          '401':
            description: No valid session or bearer token
          '403':
            description: Missing required RBAC permission for this route
  responses:
    ForgeBadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgeError'
    ForgeNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgeError'
    ForgeConflict:
      description: Resource already exists / build already in progress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgeError'
    ForgeInternalError:
      description: Unexpected internal/upstream error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgeError'
    IndexBadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IndexError'
    IndexNotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IndexError'
    WeaveBadRequest:
      description: Invalid request body or path parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WeaveError'
    WeaveNotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WeaveError'
    WeaveConflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WeaveError'
