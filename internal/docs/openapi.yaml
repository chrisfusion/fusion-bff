openapi: 3.0.3
info:
  title: fusion-bff API
  description: |
    Backend for Frontend for the fusion platform GUI. Validates OIDC sessions, enforces RBAC, and proxies authenticated requests to fusion-forge, fusion-index, fusion-weave, and fusion-content.
  version: 0.7.2
  license:
    name: GPL-3.0
servers:
- url: /
tags:
- name: health
  description: Unauthenticated liveness/readiness probes
- name: auth
  description: OIDC PKCE login flow and session endpoints
- name: rbac-admin
  description: Group-to-role assignment admin (requires admin:roles:manage)
- name: system-health
  description: Live upstream probing and manual status overrides
- name: forge
  description: Explicitly documented fusion-forge proxy endpoints (venvs, gitbuilds, appbuilds, gitwatchers).
- name: index
  description: Explicitly documented fusion-index proxy endpoints (artifacts, versions, tags, files, types).
- name: weave
  description: Explicitly documented fusion-weave proxy endpoints (job/service templates, chains, triggers,
    runs).
- name: weave-monitoring
  description: Explicitly documented fusion-weave /monitor/v1 read-only endpoints.
- name: content
  description: Explicitly documented fusion-content proxy endpoints (changelog, help, videos).
- name: proxy
  description: Fallback passthrough to fusion-forge, fusion-index, fusion-weave, and fusion-content for
    any route not explicitly documented above (e.g. a newly added upstream endpoint not yet reflected
    here). The BFF strips the /api/<service> prefix and forwards the remaining path verbatim; request/response
    bodies match each upstream service's own API. RBAC permission required per route is defined in rbac.yaml
    (route_permissions) and is not enumerated here.
paths:
  /health:
    get:
      tags:
      - health
      summary: Liveness probe
      responses:
        '200':
          description: OK
  /livez:
    get:
      tags:
      - health
      summary: Liveness probe (Kubernetes convention)
      responses:
        '200':
          description: OK
  /readyz:
    get:
      tags:
      - health
      summary: Readiness probe
      responses:
        '200':
          description: OK
  /bff/login:
    get:
      tags:
      - auth
      summary: Start OIDC PKCE login
      description: Redirects the browser to the configured OIDC provider's authorization endpoint.
      responses:
        '302':
          description: Redirect to OIDC provider
  /bff/callback:
    get:
      tags:
      - auth
      summary: OIDC authorization code callback
      description: |
        Exchanges the authorization code, validates the ID token, checks the allowlist, resolves RBAC roles/permissions, creates a server-side session, sets the HttpOnly session cookie, and redirects to POST_LOGIN_REDIRECT_URL.
      parameters:
      - in: query
        name: state
        required: true
        schema:
          type: string
      - in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to POST_LOGIN_REDIRECT_URL
        '400':
          description: Missing/invalid state or code
        '403':
          description: User not on allowlist
        '502':
          description: Token exchange or ID token validation failed
  /bff/logout:
    post:
      tags:
      - auth
      summary: Log out
      description: Revokes the refresh token, deletes the server-side session, clears the cookie, and
        redirects to the OIDC end_session endpoint.
      responses:
        '302':
          description: Redirect to OIDC end_session endpoint
  /bff/userinfo:
    get:
      tags:
      - auth
      summary: Get current session identity
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Authenticated user identity and resolved RBAC grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    items:
                      type: string
                  resource_permissions:
                    type: array
                    items:
                      type: object
                      properties:
                        permission:
                          type: string
                        resource_type:
                          type: string
                        resource_id:
                          type: string
        '401':
          description: No valid session
  /bff/system-health:
    get:
      tags:
      - system-health
      summary: Live status of all upstream services plus manual overrides
      description: Available to any authenticated user, regardless of role.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Per-service live probe result and any manual override
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: forge
                        live:
                          type: object
                          nullable: true
                          properties:
                            reachable:
                              type: boolean
                            status_code:
                              type: integer
                              nullable: true
                            latency_ms:
                              type: integer
                              nullable: true
                            error:
                              type: string
                        override:
                          type: object
                          nullable: true
                          properties:
                            service:
                              type: string
                            status:
                              type: string
                              enum:
                              - Healthy
                              - Unhealthy
                              - Offline
                              - Maintenance
                            description:
                              type: string
  /bff/admin/group-roles:
    get:
      tags:
      - rbac-admin
      summary: List group → role assignments
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All DB-backed group-role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupRoleRow'
    post:
      tags:
      - rbac-admin
      summary: Create a group → role assignment
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - group
              - role
              properties:
                group:
                  type: string
                role:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRoleRow'
        '400':
          description: group and role are required
        '409':
          description: Assignment already exists
  /bff/admin/group-roles/{id}:
    delete:
      tags:
      - rbac-admin
      summary: Delete a group → role assignment
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid id
        '404':
          description: Not found
  /bff/admin/rbac-config:
    get:
      tags:
      - rbac-admin
      summary: Static roles/groups/permissions lists (for admin UI dropdowns)
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: string
                  groups:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    items:
                      type: string
  /bff/admin/resource-permissions:
    get:
      tags:
      - rbac-admin
      summary: List resource-scoped permission grants
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourcePermRow'
    post:
      tags:
      - rbac-admin
      summary: Grant a resource-scoped permission
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subject_type
              - subject
              - permission
              - resource_type
              - resource_id
              properties:
                subject_type:
                  type: string
                  enum:
                  - user
                  - group
                  - role
                subject:
                  type: string
                permission:
                  type: string
                resource_type:
                  type: string
                resource_id:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePermRow'
        '400':
          description: All fields are required
          or invalid subject_type: null
        '409':
          description: Grant already exists
  /bff/admin/resource-permissions/{id}:
    delete:
      tags:
      - rbac-admin
      summary: Revoke a resource-scoped permission grant
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid id
        '404':
          description: Not found
  /bff/admin/service-status:
    get:
      tags:
      - system-health
      summary: List manual service status overrides
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceStatusRow'
        '503':
          description: Database not configured
  /bff/admin/service-status/{service}:
    put:
      tags:
      - system-health
      summary: Create or update a manual service status override
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
          enum:
          - forge
          - index
          - weave
          - spectra
          - content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - Healthy
                  - Unhealthy
                  - Offline
                  - Maintenance
                description:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatusRow'
        '400':
          description: Unknown service
          or invalid status: null
        '503':
          description: Database not configured
    delete:
      tags:
      - system-health
      summary: Remove a manual service status override
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
          enum:
          - forge
          - index
          - weave
          - spectra
          - content
      responses:
        '204':
          description: Deleted
        '400':
          description: Unknown service
        '404':
          description: Not found
        '503':
          description: Database not configured
  /api/forge/api/v1/venvs:
    get:
      tags:
      - forge
      summary: List requirements-based venv builds
      x-required-permission: forge:builds:read
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: status
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      - name: creatorId
        in: query
        schema:
          type: string
      - name: sortBy
        in: query
        schema:
          type: string
          default: createdAt
      - name: sortDir
        in: query
        schema:
          type: string
          default: desc
      responses:
        '200':
          description: Paginated venv build list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgePageResponse'
    post:
      tags:
      - forge
      summary: Create a venv build from an uploaded requirements.txt
      x-required-permission: forge:builds:create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateVenvRequest'
      responses:
        '202':
          description: Build accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeBuildResponse'
        '400':
          description: |
            Bind error, missing/empty/oversized (>100KB) requirements file, unsupported python_version, or lint-rule validation failure (body is ForgeValidationResponse in this one case, not ForgeError)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ForgeError'
                - $ref: '#/components/schemas/ForgeValidationResponse'
        '409':
          $ref: '#/components/responses/ForgeConflict'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/venvs/validate:
    post:
      tags:
      - forge
      summary: Validate a requirements.txt without creating a build
      x-required-permission: forge:builds:create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateVenvRequest'
      responses:
        '200':
          description: Valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeValidationResponse'
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '422':
          description: Requirements.txt fails lint rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeValidationResponse'
  /api/forge/api/v1/venvs/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - forge
      summary: Get a venv build by id
      x-required-permission: forge:builds:read
      responses:
        '200':
          description: Venv build found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeBuildResponse'
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '404':
          $ref: '#/components/responses/ForgeNotFound'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/venvs/{id}/logs:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - forge
      summary: Fetch build pod logs
      x-required-permission: forge:builds:read
      responses:
        '200':
          description: Raw pod log text
          content:
            text/plain:
              schema:
                type: string
        '204':
          description: Build exists but no log content yet
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '404':
          description: |
            Build not found, no CIBuild recorded, CIBuild CR missing, or build pod not yet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeError'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/gitbuilds:
    get:
      tags:
      - forge
      summary: List git-source builds
      x-required-permission: forge:builds:read
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: status
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      - name: creatorId
        in: query
        schema:
          type: string
      - name: sortBy
        in: query
        schema:
          type: string
          default: createdAt
      - name: sortDir
        in: query
        schema:
          type: string
          default: desc
      responses:
        '200':
          description: Paginated git build list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgePageResponse'
    post:
      tags:
      - forge
      summary: Trigger a build from a git repository
      description: |
        name/version are required unless metadata_source resolves them from the repo's pyproject.toml (metadata_source=version resolves version only; =full resolves both).
      x-required-permission: forge:builds:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGitBuildRequest'
      responses:
        '202':
          description: Build accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeBuildResponse'
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '409':
          $ref: '#/components/responses/ForgeConflict'
        '422':
          description: pyproject.toml metadata resolution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeError'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/gitbuilds/validate:
    post:
      tags:
      - forge
      summary: Dry-run validate a git build (conflict + metadata checks)
      x-required-permission: forge:builds:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGitBuildRequest'
      responses:
        '200':
          description: Valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeValidationResponse'
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '422':
          description: |
            Violations found, or a single synthetic violation when the pyproject.toml fetch itself failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeValidationResponse'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/gitbuilds/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - forge
      summary: Get a git build by id
      x-required-permission: forge:builds:read
      responses:
        '200':
          description: Git build found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeBuildResponse'
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '404':
          $ref: '#/components/responses/ForgeNotFound'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/gitbuilds/{id}/logs:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - forge
      summary: Fetch git build pod logs
      x-required-permission: forge:builds:read
      responses:
        '200':
          description: Raw pod log text
          content:
            text/plain:
              schema:
                type: string
        '204':
          description: Build exists but no log content yet
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '404':
          $ref: '#/components/responses/ForgeNotFound'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/appbuilds:
    get:
      tags:
      - forge
      summary: List app builds
      x-required-permission: forge:builds:read
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: status
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      - name: creatorId
        in: query
        schema:
          type: string
      - name: sortBy
        in: query
        schema:
          type: string
          default: createdAt
      - name: sortDir
        in: query
        schema:
          type: string
          default: desc
      responses:
        '200':
          description: Paginated app build list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgePageResponse'
    post:
      tags:
      - forge
      summary: Trigger an app build from a git repository
      description: |
        name, version, builderImage, and runner are read server-side from the repo's metadata.yaml, not supplied by the caller.
      x-required-permission: forge:builds:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppBuildRequest'
      responses:
        '202':
          description: Build accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeBuildResponse'
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '409':
          $ref: '#/components/responses/ForgeConflict'
        '422':
          description: metadata.yaml fetch/parse failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeError'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/appbuilds/validate:
    post:
      tags:
      - forge
      summary: Dry-run validate an app build
      x-required-permission: forge:builds:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppBuildRequest'
      responses:
        '200':
          description: Valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeValidationResponse'
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '422':
          description: |
            Violations found, or a single synthetic violation when metadata.yaml fetch failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeValidationResponse'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/appbuilds/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - forge
      summary: Get an app build by id
      x-required-permission: forge:builds:read
      responses:
        '200':
          description: App build found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeBuildResponse'
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '404':
          $ref: '#/components/responses/ForgeNotFound'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/appbuilds/{id}/logs:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - forge
      summary: Fetch app build pod logs
      x-required-permission: forge:builds:read
      responses:
        '200':
          description: Raw pod log text
          content:
            text/plain:
              schema:
                type: string
        '204':
          description: Build exists but no log content yet
        '400':
          $ref: '#/components/responses/ForgeBadRequest'
        '404':
          $ref: '#/components/responses/ForgeNotFound'
        '500':
          $ref: '#/components/responses/ForgeInternalError'
  /api/forge/api/v1/builds:
    delete:
      tags:
      - forge
      summary: Bulk-delete builds matching status/age/type filters
      x-required-permission: forge:builds:delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteBuildsRequest'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeBulkDeleteResponse'
        '400':
          description: older_than is zero/missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeError'
        '422':
          description: unknown status or build_type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeError'
  /api/forge/api/v1/builds/zombie-cleanup:
    post:
      tags:
      - forge
      summary: Delete stuck/zombie builds older than a cutoff
      x-required-permission: forge:admin:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZombieCleanupRequest'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeBulkDeleteResponse'
        '400':
          description: older_than is zero/missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgeError'
        '422':
          description: unknown build_type
          content:
